<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <h1>La tua carta regalo Bricokart</h1>
    <p>Complimenti! Hai ricevuto una carta regalo.</p>
    <ul>
      <li><strong>Codice:</strong> {{cardCode}}</li>
      <li><strong>Valore:</strong> {{cardValue}}</li>
      <li><strong>Data di scadenza:</strong> {{expirationDate}}</li>
    </ul>
    <p>Mostra questo QR code, oppure comunica il codice al negoziante per riscattare la carta regalo</p>
    <p><img src="cid:giftCardQr" alt="Codice QR della carta regalo" width="220" height="220"></p>
  </body>
</html>
