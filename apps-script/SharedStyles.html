<style>
  :root {
    color-scheme: light;
    font-family: Arial, sans-serif;
    color: #1f2937;
    background: #f3f4f6;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f4f6; }
  button, input { font: inherit; }
  .page { max-width: 760px; margin: 0 auto; padding: 16px; }
  .app-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.5rem; }
  h2 { font-size: 1.2rem; }
  .panel, .card-item { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .panel { padding: 20px; }
  .card-item { padding: 16px; margin: 12px 0; }
  .primary-button, .secondary-button, .tab { border: 0; border-radius: 8px; cursor: pointer; min-height: 44px; padding: 10px 14px; }
  .primary-button { background: #0369a1; color: #fff; font-weight: 700; }
  .secondary-button { background: #e5e7eb; color: #111827; }
  .primary-button:disabled { background: #94a3b8; cursor: wait; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
  .tab { background: #e5e7eb; color: #374151; padding: 10px 4px; }
  .tab[aria-selected="true"] { background: #0369a1; color: #fff; font-weight: 700; }
  .card-list[hidden], .tab-panel[hidden] { display: none; }
  .card-heading { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .card-code { font-family: monospace; font-size: 1.05rem; font-weight: 700; }
  .meta { color: #4b5563; font-size: .92rem; margin: 8px 0 0; }
  .status { border-radius: 999px; display: inline-block; font-size: .82rem; font-weight: 700; padding: 4px 8px; }
  .status-active { background: #dcfce7; color: #166534; }
  .status-redeemed { background: #dbeafe; color: #1d4ed8; }
  .status-expired { background: #fee2e2; color: #b91c1c; }
  .notice { border-radius: 8px; margin: 12px 0; padding: 12px; }
  .notice-error { background: #fee2e2; color: #991b1b; }
  .notice-success { background: #dcfce7; color: #166534; }
  .details { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 0; }
  .details div { border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
  .details dt { color: #4b5563; font-size: .9rem; }
  .details dd { margin: 4px 0 0; font-weight: 600; overflow-wrap: anywhere; }
  .form-field { display: grid; gap: 6px; margin-bottom: 16px; }
  .form-field input { border: 1px solid #9ca3af; border-radius: 8px; min-height: 44px; padding: 8px 10px; width: 100%; }
  .form-actions, .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  a.button-link { align-items: center; display: inline-flex; justify-content: center; text-decoration: none; }
  .loading { color: #4b5563; padding: 24px; text-align: center; }
  @media (min-width: 600px) {
    .page { padding: 28px; }
    .details { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
